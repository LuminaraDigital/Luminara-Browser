[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "luminara-browser-forge"
version = "2.1.0"
description = "Zero-dependency Ungoogled-Chromium 157 customization forge, Dual Human+AI CDP Co-Browsing Daemon, BulkEngine, Generative UI Workspace, and MCP v2 server."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Luminara Engineering" }]
keywords = ["browser", "agent", "mcp", "cdp", "ungoogled-chromium", "luminara"]
dependencies = []

[project.scripts]
luminara-forge = "forge.cli:main"

[tool.setuptools]
package-dir = {"" = "chromium-forge"}
packages = ["forge"]

[tool.setuptools.package-data]
forge = ["ui/*.html"]
