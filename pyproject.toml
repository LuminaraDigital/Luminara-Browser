[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "luminara-browser-forge"
version = "4.0.0"
description = "Zero-dependency Chromium/Ungoogled-Chromium v4 Forge, Multiplexed CDP + AXTree + W3C WebMCP Daemon, PiBot Multi-Bot Team Hub, DPAPI/AEAD Vault, Network Mutation Firewall, Numbat Sequence Guard, Hermetic VRT, Fenced Monitors, FTS5 Workspaces, Warm Atelier UI, and 28-Tool MCP v2 Server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
authors = [{ name = "Luminara Engineering" }]
keywords = ["browser", "agent", "mcp", "cdp", "ungoogled-chromium", "luminara"]
dependencies = []

[project.scripts]
luminara-forge = "forge.cli:main"

[tool.setuptools]
package-dir = {"" = "chromium-forge"}
packages = ["forge"]

[tool.setuptools.package-data]
forge = ["ui/*.html", "ui/*.png", "ui/*.webp", "ui/*.ico", "patches/luminara/*", "rea_evidence/*.json"]
