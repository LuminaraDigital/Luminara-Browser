[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "luminara-browser-forge"
version = "3.0.0"
description = "Zero-dependency Chromium/Ungoogled-Chromium 100x Forge, Multiplexed CDP + AXTree + W3C WebMCP Daemon, DPAPI/AEAD Vault, Network Mutation Firewall, FTS5 Knowledge Workspaces, Privacy Shield v3, and 20-Tool MCP v2 Server."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Luminara Engineering" }]
keywords = ["browser", "agent", "mcp", "cdp", "ungoogled-chromium", "luminara"]
dependencies = []

[project.scripts]
luminara-forge = "forge.cli:main"

[tool.setuptools]
package-dir = {"" = "chromium-forge"}
packages = ["forge"]

[tool.setuptools.package-data]
forge = ["ui/*.html"]
