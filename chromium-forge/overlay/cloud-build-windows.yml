name: Build Luminara Browser 16-Stage Cloud Compiler (Windows x64)

on:
  workflow_dispatch:
    inputs:
      stage_limit:
        description: 'Max 3.5h compilation stages (1..16)'
        required: false
        default: '16'

jobs:
  verify-custom-patches:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Chromium Forge REA + Upstream Patch Pre-Flight Gate
        shell: bash
        run: |
          cd chromium-forge
          python -W error -m unittest discover -s tests -v
          python -m forge verify-upstream-patches
          python -m forge verify-rea --static-only

  # 16-stage checkpointed Ninja + ThinLTO + PGO pipeline (exit 124 checkpoints cleanly across 3.5h windows)
  compile-stage-1:
    needs: verify-custom-patches
    if: always() && needs.verify-custom-patches.result == 'success' && fromJSON(inputs.stage_limit || '16') >= 1
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install V8 Metagen Clang Bindings & Forge Package
        run: |
          python -m pip install -e .
          python -m pip install httplib2==0.22.0 clang==21.1.7
      - name: Apply Luminara Browser Overlay & Run Ninja Stage 1/16 (PGO + ThinLTO)
        run: |
          luminara-forge export-windows-overlay --profile chromium-forge/fork.json --windows-repo ./ungoogled-chromium-windows
          cd ungoogled-chromium-windows
          python build.py --ci -j 4 
      - name: Checkpoint Stage 1 Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luminara-stage-1-${{ matrix.arch }}
          path: ungoogled-chromium-windows/build/src/out/Default
          retention-days: 3
  compile-stage-2:
    needs: compile-stage-1
    if: always() && needs.compile-stage-1.result == 'success' && fromJSON(inputs.stage_limit || '16') >= 2
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore Checkpointed Build Tree (Stage 1)
        uses: actions/download-artifact@v4
        with:
          name: luminara-stage-1-${{ matrix.arch }}
          path: ungoogled-chromium-windows/build/src/out/Default
      - name: Install V8 Metagen Clang Bindings & Forge Package
        run: |
          python -m pip install -e .
          python -m pip install httplib2==0.22.0 clang==21.1.7
      - name: Apply Luminara Browser Overlay & Run Ninja Stage 2/16 (PGO + ThinLTO)
        run: |
          luminara-forge export-windows-overlay --profile chromium-forge/fork.json --windows-repo ./ungoogled-chromium-windows
          cd ungoogled-chromium-windows
          python build.py --ci -j 4 
      - name: Checkpoint Stage 2 Artifacts
        if: always()
        uses: actions/upload-artifact@v4
