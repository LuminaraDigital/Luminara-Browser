name = "luminara-browser"
main = "cloudflare/src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "./cloudflare/public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
APP_NAME = "Luminara Browser"
APP_VERSION = "2.1.0"
CHROMIUM_BASE = "157.0.8103.78-1.1"
LOCAL_MCP_ENDPOINT = "http://127.0.0.1:8796/api/agent/mcp"
GITHUB_REPO = "https://github.com/luminara-digital/luminara-browser"
